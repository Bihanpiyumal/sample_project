<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <metahttp-equiv="refresh" content="5">
    <link href="../ls/CSS/subscribe.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <title>Subscribe</title>
</head>
<body>
    <div class="description">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Fill out the form below and we’ll get back to you as soon as possible.</p>
    </div>

    <div class="container">
        <h3>Join Now</h3>
        <form>
            <label>Full Name:</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email:</label>
            <input type="text" name="name" placeholder="Enter your email" required>

            <label>COntent Type:</label>
            <select>
                <option value="vlog">Vlogs</option>
                <option value="review">Reviews</option>
                <option value="interview">Interviews</option>
            </select>

            <label>Subscribe to our Newsletter:</label>
            <input class="check" type="checkbox" name="subject" >

            <label>Payement</label><br/>
        <div class="payment">
            <label class="content" >Free</label>
            <input type="radio" name="free">
            <label class="content" >Premium</label>
            <input type="radio" name="free">
            <label class="content" >VIP</label>
            <input type="radio" name="free">
        </div>

            <button type="submit">Subscribe Now</button>
        </form>
    </div>

    <footer>
        <p class="copyright">2025 My YouTube Channel | Follow us on </p>
            <div class="icon">
            <a href="https://www.facebook.com/" target="_blank"><img class="socialmedia" src="../ls/Images/fb.png"></a>
            <a href="https://www.instagram.com/" target="_blank"><img class="socialmedia" src="../ls/Images/insta.png"></a>
            <a href="https://x.com/?lang=en" target="_blank"><img class="socialmedia" src="../ls/Images/x.png"></a>
            </div>
        
    </footer>
</body>
</html>
