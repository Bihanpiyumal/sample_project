<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <metahttp-equiv="refresh" content="5">
    <link href="../ls/CSS/contact.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <title>Contact Us</title>
</head>
<body>
    <div class="description">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Fill out the form below and we’ll get back to you as soon as possible.</p>
    </div>

    <div class="container">
        <form>
            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="text" name="name" placeholder="Enter your email" required>

            <label>Phone Number:</label>
            <input type="tel" name="number" placeholder="Enter your phone number" required>

            <label>Subject:</label>
            <input type="text" name="subject" placeholder="Enter your Subject">

            <label>Message:</label>
            <textarea name="message" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        <p class="copyright">2025 My YouTube Channel | Follow us on </p>
            <div class="icon">
            <a href="https://www.facebook.com/" target="_blank"><img class="socialmedia" src="../ls/Images/fb.png"></a>
            <a href="https://www.instagram.com/" target="_blank"><img class="socialmedia" src="../ls/Images/insta.png"></a>
            <a href="https://x.com/?lang=en" target="_blank"><img class="socialmedia" src="../ls/Images/x.png"></a>
            </div>
        
    </footer>
</body>
</html>
